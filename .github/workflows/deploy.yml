name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm (recommended)
        uses: pnpm/action-setup@v2
        with:
          version: '9'   # installs latest 9.x; change to '8' if you need v8

      - name: Print environment & versions (debug)
        run: |
          echo "PWD: $(pwd)"
          node --version
          npm --version
          pnpm --version
          ls -la

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Show build output (debug

