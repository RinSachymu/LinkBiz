# use this inside your job's steps (replace the current Setup / Install steps)
- name: Checkout
  uses: actions/checkout@v4

- name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: '20'

# Install pnpm reliably (uses maintained action)
- name: Setup pnpm
  uses: pnpm/action-setup@v2
  with:
    version: '9'   # use '9' if your lockfile was created with pnpm v9; change if needed

- name: Print environment (debug)
  run: |
    node --version
    npm --version
    pnpm --version
    ls -la

- name: Install dependencies (pnpm)
  run: pnpm install --frozen-lockfile

- name: Build
  run: pnpm build
